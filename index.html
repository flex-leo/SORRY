<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>for my wifey</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:cursive;
  background:linear-gradient(#0b1d3a,#1a3b6e);
  color:white;
  text-align:center;
  overflow:hidden;
}

.screen{display:none;height:100vh;padding:20px}
.active{display:block}

button{
  padding:14px 28px;
  border:none;
  border-radius:30px;
  background:#ff7eb3;
  color:white;
  font-size:18px;
  cursor:pointer;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.07)}
  100%{transform:scale(1)}
}

.type{font-size:26px;white-space:pre-line;margin-top:40px}

.board{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-top:40px
}

.card{
  background:white;
  color:#ff4d88;
  padding:25px;
  border-radius:15px;
  cursor:pointer;
  transition:transform .6s;
}

.card.open{
  transform:rotateY(180deg);
  background:#ff4d88;
  color:white
}

.snow{
  position:absolute;
  top:-10px;
  animation:snow 10s linear infinite
}
@keyframes snow{to{transform:translateY(110vh)}}

.polaroid{
  background:white;
  padding:12px;
  width:230px;
  margin:20px auto;
  border-radius:8px;
  animation:swing 3s infinite
}
@keyframes swing{
  0%{transform:rotate(-4deg)}
  50%{transform:rotate(4deg)}
  100%{transform:rotate(-4deg)}
}
.polaroid img{width:100%;border-radius:6px}
.polaroid p{color:#ff4d88}

.sorrybox{
  position:fixed;
  inset:0;
  background:black;
  display:none;
  z-index:99
}
.sorrytext{
  position:absolute;
  color:#ff9acb;
  animation:pop 3s forwards;
  white-space:nowrap
}
@keyframes pop{
  0%{opacity:0;transform:scale(.5)}
  30%{opacity:1}
  100%{opacity:0;transform:translateY(-40px)}
}
.final{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:26px;
  opacity:0;
  animation:fade 4s forwards;
  animation-delay:6s
}
@keyframes fade{to{opacity:1}}
</style>
</head>

<body>

<div class="screen active" id="s1">
  <div class="type" id="t1"></div>
  <br><br>
  <button onclick="next(2)">start wifey</button>
</div>

<div class="screen" id="s2">
  <h2>pick one one</h2>
  <div class="board">
    <div class="card" onclick="openC(this,'u r special to me')">u r special</div>
    <div class="card" onclick="openC(this,'u r my comfort')">my comfort</div>
    <div class="card" onclick="openC(this,'u r my happiness')">my happiness</div>
    <div class="card" onclick="go3()">open me</div>
  </div>
</div>

<div class="screen" id="s3">
  <div class="type" id="t3"></div>
  <br><br>
  <button onclick="next(4)">next</button>
</div>

<div class="screen" id="s4">
  <h2>merry christmas wifey</h2>
  <div class="polaroid">
    <img src="wifey.jpg">
    <p>meri sabse pyaari</p>
  </div>
  <button onclick="startSorry()">meri galti h</button>
</div>

<div class="sorrybox" id="sorry">
  <div class="final">
    sorryyyyy meri bacchi<br><br>
    galti meri thi<br>
    par pyaar sirf aapse h<br><br>
    please maan jao na
  </div>
</div>

<script>
function next(n){
  document.querySelector(".active").classList.remove("active")
  document.getElementById("s"+n).classList.add("active")
}

function type(el,text,i=0){
  if(i<text.length){
    el.innerHTML+=text[i]
    setTimeout(()=>type(el,text,i+1),50)
  }
}
type(document.getElementById("t1"),
"hi wifey\n\nchhota sa surprise h\nmere dil se")

function openC(c,t){
  c.classList.add("open")
  c.innerText=t
}

function go3(){
  next(3)
  type(document.getElementById("t3"),
"aap sirf special nahi\nmeri aadat ho\nmeri sukoon ho\nmeri wifey ho")
}

const names=[
"sorryyyyy baby","sorryyyyy jaan","sorryyyy meri bacchi",
"sorry darling","sorry sweetheart","sorry my love",
"sorry meri jaan","sorry princess","sorry angel"
]

function startSorry(){
  document.getElementById("sorry").style.display="block"
  let i=0
  let int=setInterval(()=>{
    let d=document.createElement("div")
    d.className="sorrytext"
    d.innerText=names[Math.floor(Math.random()*names.length)]
    d.style.left=Math.random()*90+"vw"
    d.style.top=Math.random()*90+"vh"
    document.getElementById("sorry").appendChild(d)
    i++
    if(i>200)clearInterval(int)
  },80)
}

for(let i=0;i<50;i++){
  let s=document.createElement("div")
  s.className="snow"
  s.innerHTML="❄"
  s.style.left=Math.random()*100+"vw"
  s.style.animationDuration=5+Math.random()*5+"s"
  document.body.appendChild(s)
}
</script>

</body>
</html>
